name: capture blocked handoff reports

on:
  push:
    paths:
      - release/evidence-index.json
      - release/component-manifest.json
      - release/handoff-evidence/**
      - tests/contracts/handoff-manifest.json
      - tests/contracts/evidence/**
      - tests/providers/evidence/**
      - tests/consumers/evidence/**
      - tests/handoffs/**
      - tools/verify_handoff.py
      - tools/capture_handoff_reports.py
      - docs/contracts/handoff-report-capture.md
      - .github/workflows/handoff-report-capture.yml
  pull_request:
    paths:
      - release/evidence-index.json
      - release/component-manifest.json
      - release/handoff-evidence/**
      - tests/contracts/handoff-manifest.json
      - tests/contracts/evidence/**
      - tests/providers/evidence/**
      - tests/consumers/evidence/**
      - tests/handoffs/**
      - tools/verify_handoff.py
      - tools/capture_handoff_reports.py
      - docs/contracts/handoff-report-capture.md
      - .github/workflows/handoff-report-capture.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.17'
      - name: Select fresh external capture path
        run: |
          printf 'CAPTURE_OUTPUT=%s\n' "$RUNNER_TEMP/ei-handoff-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Check whitespace in the actual checked-out change
        run: git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --check HEAD^ HEAD
      - name: Test capture controls (not readiness)
        run: |
          python3 -B - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover(
              'tests/handoffs', pattern='test_capture_handoff_reports.py')
          expected = 13
          if suite.countTestCases() != expected:
              raise SystemExit('Capture helper inventory changed')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if (result.testsRun != expected or not result.wasSuccessful()
                  or result.skipped or result.expectedFailures or result.unexpectedSuccesses):
              raise SystemExit('Capture helper controls incomplete or failed')
          PY
      - name: Capture four BLOCKED reports (not release readiness)
        if: always()
        run: python3 -I -B tools/capture_handoff_reports.py --output "$CAPTURE_OUTPUT"
      - name: Preserve exact reports and failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: handoff-report-capture
          path: ${{ env.CAPTURE_OUTPUT }}
          if-no-files-found: error
          retention-days: 90
