name: private reviewed source context

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reviewed-source-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      - name: Install the locked host TypeScript compiler
        run: node tools/install-typescript-host.mjs
      - name: Verify real retained-source composition with synthetic private authorities
        run: node tools/verify-reviewed-source-context.mjs
      - name: Recheck existing privacy transitions and serialization
        run: make verify CASE=content-privacy MODE=mock
      - name: Type-check strict private context consumer
        run: >-
          ./node_modules/.bin/tsc --noEmit --strict --target ES2022 --module NodeNext
          --moduleResolution NodeNext --lib ES2022,DOM --types node --skipLibCheck false
          tests/reviewed-source-context/types-consumer.mts
      - run: npm run typecheck
