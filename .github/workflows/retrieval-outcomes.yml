name: private retrieval outcomes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  retrieval-outcomes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      - name: Install the locked host TypeScript compiler
        run: node tools/install-typescript-host.mjs
      - name: Verify real controlled transport outcomes with synthetic local sources
        run: node tools/verify-retrieval-outcomes.mjs
      - name: Verify required inventory rejects missing, reduced and skipped cases
        run: node --test tests/security/retrieval-outcomes/verifier.test.mjs
      - name: Type-check new private and unchanged public consumers
        run: >-
          ./node_modules/.bin/tsc --noEmit --strict --target ES2022 --module NodeNext
          --moduleResolution NodeNext --lib ES2022,DOM --types node --skipLibCheck false
          tests/security/retrieval-outcomes/types-consumer.mts types/consumer-fixture.mts
      - run: npm run typecheck
      - name: Verify static source dependency inventory
        run: make verify-dependencies
      - name: Check the actual merge-relative diff
        shell: bash
        run: |
          comparison_base="$(git merge-base HEAD origin/main)"
          if [ "$comparison_base" = "$(git rev-parse HEAD)" ]; then
            comparison_base="$(git rev-parse HEAD^)"
          fi
          echo "comparison_base=$comparison_base"
          echo "candidate=$(git rev-parse HEAD)"
          git diff --check "$comparison_base" HEAD
