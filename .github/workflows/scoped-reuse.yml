name: scoped-reuse

on:
  push:
    paths:
      - 'src/cache/reuse/**'
      - 'src/security/**'
      - 'src/evidence/**'
      - 'src/review/history/**'
      - 'src/private/boundary-guard.*'
      - 'tests/cache/reuse/**'
      - 'tests/review/history/**'
      - 'tests/integration/review-cache-binding/**'
      - 'tests/security/support.mjs'
      - 'tools/verify.mjs'
      - 'tools/install-typescript-host.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.types.json'
      - 'docs/cache/scoped-reuse.md'
      - '.github/workflows/scoped-reuse.yml'
  pull_request:
    paths:
      - 'src/cache/reuse/**'
      - 'src/security/**'
      - 'src/evidence/**'
      - 'src/review/history/**'
      - 'src/private/boundary-guard.*'
      - 'tests/cache/reuse/**'
      - 'tests/review/history/**'
      - 'tests/integration/review-cache-binding/**'
      - 'tests/security/support.mjs'
      - 'tools/verify.mjs'
      - 'tools/install-typescript-host.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.types.json'
      - 'docs/cache/scoped-reuse.md'
      - '.github/workflows/scoped-reuse.yml'

permissions:
  contents: read

jobs:
  verify-scoped-reuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      - name: Install the locked host TypeScript compiler
        run: node tools/install-typescript-host.mjs
      - name: Verify local cache invalidation, correction recovery and conditional transport
        run: node tools/verify.mjs --case cache-invalidation --mode mock
      - run: npm run typecheck
      - name: Strict scoped reuse declaration consumer
        run: ./node_modules/.bin/tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext --lib ES2022,DOM --types node --skipLibCheck false tests/cache/reuse/types-consumer.mts
      - name: Strict conditional revalidation and correction/history consumers
        run: >-
          ./node_modules/.bin/tsc --noEmit --strict --target ES2022 --module NodeNext
          --moduleResolution NodeNext --lib ES2022,DOM --types node --skipLibCheck false
          tests/cache/reuse/revalidation-types-consumer.mts
          tests/cache/reuse/public-revalidation-types-consumer.mts
          tests/review/history/types-consumer.mts
          tests/integration/review-cache-binding/types-consumer.mts
