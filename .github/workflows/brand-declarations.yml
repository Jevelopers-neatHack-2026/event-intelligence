name: private brand declarations

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  brand-declarations:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      - name: Install the locked host TypeScript compiler
        run: node tools/install-typescript-host.mjs
      - name: Verify private source declarations with synthetic authority
        run: node tools/verify-brand-declarations.mjs
      - name: Verify required inventory rejects missing, reduced and skipped cases
        run: node --test tests/brand-declarations/verifier.test.mjs
      - name: Type-check strict private consumer
        run: >-
          ./node_modules/.bin/tsc --noEmit --strict --target ES2022 --module NodeNext
          --moduleResolution NodeNext --lib ES2022,DOM --types node --skipLibCheck false
          tests/brand-declarations/types-consumer.mts
      - run: npm run typecheck
