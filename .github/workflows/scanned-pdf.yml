name: bounded scanned PDF raster reader

on:
  push:
    paths:
      - src/extraction/scanned-pdf/**
      - tests/extraction/scanned-pdf/**
      - tools/scanned-pdf/**
      - tools/verify-scanned-pdf.mjs
      - docs/extraction/scanned-pdf.md
      - .github/workflows/scanned-pdf.yml
      - package.json
      - package-lock.json
      - tsconfig.types.json
  pull_request:
    paths:
      - src/extraction/scanned-pdf/**
      - tests/extraction/scanned-pdf/**
      - tools/scanned-pdf/**
      - tools/verify-scanned-pdf.mjs
      - docs/extraction/scanned-pdf.md
      - .github/workflows/scanned-pdf.yml
      - package.json
      - package-lock.json
      - tsconfig.types.json

permissions:
  contents: read

jobs:
  scanned-pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.3
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: 3.12.14
          architecture: x64
      - name: Install the reviewed PDFium wheel and capture the local runtime closure
        run: python tools/scanned-pdf/install.py
      - run: npm ci
      - name: Install the locked host TypeScript compiler
        run: node tools/install-typescript-host.mjs
      - name: Require all source, native isolation, recovery and consumer-boundary cases
        run: node tools/verify-scanned-pdf.mjs
      - name: Typecheck the private scanned-PDF consumer
        run: >-
          ./node_modules/.bin/tsc --noEmit --strict --target ES2022 --module NodeNext
          --moduleResolution NodeNext --lib ES2022,DOM --types node --skipLibCheck false
          --noErrorTruncation tests/extraction/scanned-pdf/types-consumer.mts
      - run: npm run typecheck
      - name: Preserve source-bound verification and the exact runtime/dependency receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: scanned-pdf-verification
          path: |
            tools/scanned-pdf/lock.json
            src/extraction/scanned-pdf/profile.json
            tools/scanned-pdf/runtime/manifest.json
            tools/scanned-pdf/runtime/verification.json
          if-no-files-found: error
          retention-days: 90
