name: bounded static image to OCR composition

on:
  push:
    paths:
      - src/extraction/static-image-ocr/**
      - src/extraction/png/**
      - src/extraction/jpeg-webp/**
      - src/extraction/local-ocr/**
      - tests/extraction/static-image-ocr/**
      - tests/extraction/png/**
      - tests/extraction/jpeg-webp/**
      - tests/extraction/local-ocr/**
      - tools/static-image-ocr/**
      - tools/static-raster/**
      - tools/local-ocr/**
      - tools/verify-static-image-ocr.mjs
      - tools/install-typescript-host.mjs
      - docs/extraction/static-image-ocr.md
      - .github/workflows/static-image-ocr.yml
      - package.json
      - package-lock.json
      - tsconfig.types.json
      - tools/mirror-composition-evidence.py
      - tests/tools/test_mirror_composition_evidence.py
  pull_request:
    paths:
      - src/extraction/static-image-ocr/**
      - src/extraction/png/**
      - src/extraction/jpeg-webp/**
      - src/extraction/local-ocr/**
      - tests/extraction/static-image-ocr/**
      - tests/extraction/png/**
      - tests/extraction/jpeg-webp/**
      - tests/extraction/local-ocr/**
      - tools/static-image-ocr/**
      - tools/static-raster/**
      - tools/local-ocr/**
      - tools/verify-static-image-ocr.mjs
      - tools/install-typescript-host.mjs
      - docs/extraction/static-image-ocr.md
      - .github/workflows/static-image-ocr.yml
      - package.json
      - package-lock.json
      - tsconfig.types.json
      - tools/mirror-composition-evidence.py
      - tests/tools/test_mirror_composition_evidence.py

permissions:
  contents: read

jobs:
  static-image-ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.3
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
          architecture: x64
      - name: Verify the fixed evidence-mirror controls (not product/readiness tests)
        run: python -I -S -B tests/tools/test_mirror_composition_evidence.py
      - run: npm ci
      - name: Install the locked host TypeScript compiler
        run: node tools/install-typescript-host.mjs
      - name: Acquire the exact hash-pinned development wheel
        run: >-
          python -I -m pip --isolated download --disable-pip-version-check
          --only-binary=:all: --no-deps --require-hashes
          --dest "$RUNNER_TEMP/ei-static-image-ocr-wheels"
          -r tools/static-raster/requirements.txt
      - name: Install the existing JPEG WebP profile into a fresh offline runtime
        env:
          EI_STATIC_IMAGE_OCR_RASTER_RUNTIME: ${{ runner.temp }}/ei-static-image-ocr-raster
        run: >-
          python -I -S -B tools/static-raster/install.py
          --wheel "$RUNNER_TEMP/ei-static-image-ocr-wheels/pillow-12.3.0-cp312-cp312-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl"
          --destination "$EI_STATIC_IMAGE_OCR_RASTER_RUNTIME"
      - name: Install the existing native OCR libraries and exact English model
        run: python tools/local-ocr/install.py
      - name: Require all composed native, deadline, negative, recovery and boundary cases
        env:
          EI_STATIC_IMAGE_OCR_RASTER_RUNTIME: ${{ runner.temp }}/ei-static-image-ocr-raster
        run: node tools/verify-static-image-ocr.mjs
      - name: Check all four strict media consumers
        run: >-
          ./node_modules/.bin/tsc --noEmit --strict --target ES2022 --module NodeNext
          --moduleResolution NodeNext --lib ES2022,DOM --types node --skipLibCheck false
          --noErrorTruncation tests/extraction/static-image-ocr/types-consumer.mts
          tests/extraction/png/types-consumer.mts tests/extraction/jpeg-webp/types-consumer.mts
          tests/extraction/local-ocr/types-consumer.mts
      - run: npm run typecheck
      - name: Mirror bounded synthetic composition evidence for API review
        if: always()
        env:
          EI_STATIC_IMAGE_OCR_RASTER_RUNTIME: ${{ runner.temp }}/ei-static-image-ocr-raster
        run: python -I -S -B tools/mirror-composition-evidence.py static-image
      - name: Preserve structured verification and dependency receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: static-image-ocr-verification
          path: |
            src/extraction/static-image-ocr/profile.mjs
            src/extraction/local-ocr/profile.json
            tests/extraction/static-image-ocr/fixtures/provenance.json
            tools/static-raster/requirements.txt
            tools/static-raster/PILLOW-LICENSE.txt
            ${{ runner.temp }}/ei-static-image-ocr-raster/runtime.json
            tools/local-ocr/lock.json
            tools/local-ocr/provenance.json
            tools/local-ocr/notices/
            tools/local-ocr/runtime/manifest.json
            tools/local-ocr/runtime/host-provenance.json
            tools/local-ocr/runtime/host-notices/
            tools/local-ocr/runtime/verification.json
            tools/local-ocr/runtime/initialization-attempts/
            tools/static-image-ocr/runtime/verification.json
            tools/static-image-ocr/runtime/verification/*/summary.json
            tools/static-image-ocr/runtime/verification/*/source-map.json
            tools/static-image-ocr/runtime/verification/*/stdout.tap
            tools/static-image-ocr/runtime/verification/*/stderr.txt
          if-no-files-found: error
          retention-days: 90
