name: local OCR inspection report integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  inspection-ocr-report-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set runner-local inspection paths
        shell: bash
        run: |
          : "${RUNNER_TEMP:?}" "${GITHUB_ENV:?}"
          printf '%s\n' \
            "EI_JPEG_WEBP_TEST_RUNTIME=$RUNNER_TEMP/ei-inspection-ocr-jpeg-runtime" \
            "EI_STATIC_IMAGE_OCR_RASTER_RUNTIME=$RUNNER_TEMP/ei-inspection-ocr-jpeg-runtime" \
            "EI_INSPECTION_OCR_REPORT_CAPTURE=$RUNNER_TEMP/ei-inspection-ocr-evidence" \
            "EI_JPEG_WEBP_TEST_WHEEL=$RUNNER_TEMP/ei-inspection-ocr-wheels/pillow-12.3.0-cp312-cp312-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl" \
            "EI_INSPECTION_MEDIA_REPORT_CAPTURE=$RUNNER_TEMP/ei-inspection-media-evidence" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.3
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.14'
          architecture: x64
      - run: npm ci
      - name: Install the locked host TypeScript compiler
        run: node tools/install-typescript-host.mjs
      - name: Acquire the two existing hash-pinned development wheels
        run: >-
          python -I -m pip --isolated download --disable-pip-version-check
          --only-binary=:all: --no-deps --require-hashes
          --dest "$RUNNER_TEMP/ei-inspection-ocr-wheels"
          -r tools/static-raster/requirements.txt -r tools/scanned-pdf/requirements.txt
      - name: Install both declared runtimes offline
        run: |
          python -I -S -B tools/static-raster/install.py --wheel "$EI_JPEG_WEBP_TEST_WHEEL" --destination "$EI_JPEG_WEBP_TEST_RUNTIME"
          python -I -S -B tools/scanned-pdf/install.py --wheel "$RUNNER_TEMP/ei-inspection-ocr-wheels/pypdfium2-5.14.0-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl"
      - name: Install the exact local OCR native dependencies and model
        run: python -I -S -B tools/local-ocr/install.py
      - name: Verify actual OCR caller bindings and retain all raw evidence
        run: |
          mkdir -p "$EI_INSPECTION_OCR_REPORT_CAPTURE"
          if node tools/verify-inspection-ocr-report.mjs --mode mock > "$EI_INSPECTION_OCR_REPORT_CAPTURE/wrapper.stdout" 2> "$EI_INSPECTION_OCR_REPORT_CAPTURE/wrapper.stderr"; then result=0; else result=$?; fi
          cat "$EI_INSPECTION_OCR_REPORT_CAPTURE/wrapper.stdout"
          cat "$EI_INSPECTION_OCR_REPORT_CAPTURE/wrapper.stderr" >&2
          exit "$result"
      - name: Compile the report and actual component consumers
        run: >-
          node node_modules/typescript/bin/tsc --noEmit --strict --target ES2022
          --module NodeNext --moduleResolution NodeNext --lib ES2022,DOM
          --types node --skipLibCheck false --noErrorTruncation
          tests/inspection-report/ocr/types-consumer.mts
          tests/extraction/static-image-ocr/types-consumer.mts
          tests/extraction/scanned-pdf-ocr/types-consumer.mts
          tests/inspection-report/types-consumer.mts
          tests/inspection-report/media/types-consumer.mts
          tests/extraction/types-consumer.mts
          tests/extraction/pdf/types-consumer.mts
          tests/extraction/png/types-consumer.mts
          tests/extraction/jpeg-webp/types-consumer.mts
          tests/extraction/scanned-pdf/types-consumer.mts
      - run: npm run typecheck
      - name: Mirror the fixed synthetic report and startup evidence inventory
        if: always()
        shell: bash
        run: |
          python -I -S -B - <<'PY'
          import base64, hashlib, json, os, re, stat
          from pathlib import Path

          root = Path.cwd().resolve(strict=True)
          temporary = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
          if temporary == root or root in temporary.parents:
              raise ValueError("capture destination must remain outside source")

          def directory(selected):
              if (not selected.is_absolute() or selected.is_symlink()
                      or selected.resolve(strict=True) != selected
                      or not stat.S_ISDIR(selected.lstat().st_mode)):
                  raise ValueError("capture directory must be ordinary and canonical")
              return selected

          def temporary_capture(variable):
              selected = directory(Path(os.environ[variable]))
              if selected.parent != temporary:
                  raise ValueError("capture must be a direct runner-temp child")
              return selected

          media = temporary_capture("EI_INSPECTION_MEDIA_REPORT_CAPTURE")
          ocr = temporary_capture("EI_INSPECTION_OCR_REPORT_CAPTURE")
          media_names = [
              "source-before.json", "source-after.json", "actual-fixture-origins.json",
              "static-png.stdout", "static-png.stderr", "static-png.command.json",
              "static-jpeg-webp.stdout", "static-jpeg-webp.stderr", "static-jpeg-webp.command.json",
              "scanned-pdf.stdout", "scanned-pdf.stderr", "scanned-pdf.command.json",
              "scanned-pdf.stderr-recovery.json", "scanned-pdf.child-stderr",
          ]
          ocr_names = [
              "wrapper.stdout", "wrapper.stderr", "ocr-report.json", "fixture-origin.json",
              "cancellation-and-recovery.json",
              "text-png.native-result.json", "text-jpeg.native-result.json",
              "text-webp.native-result.json", "blank-png.native-result.json",
              "transparent-png.native-result.json", "text-pdf.native-result.json",
              "blank-pdf.native-result.json",
              "static-image-ocr.stdout", "static-image-ocr.stderr", "static-image-ocr.command.json",
              "static-image-ocr.child-stderr-recovery.json", "static-image-ocr.child-stderr",
              "static-image-ocr.caller-record.json",
              "scanned-pdf-ocr.stdout", "scanned-pdf-ocr.stderr", "scanned-pdf-ocr.command.json",
              "scanned-pdf-ocr.child-stderr-recovery.json", "scanned-pdf-ocr.child-stderr",
              "scanned-pdf-ocr.caller-record.json",
          ]
          selections = []
          for label, selected, names in (("media", media, media_names), ("ocr", ocr, ocr_names)):
              if sorted(item.name for item in selected.iterdir()) != sorted(names):
                  raise ValueError("missing or unexpected report capture member")
              selections.extend((label + "/" + name, selected / name) for name in names)

          ocr_runtime = directory(root / "tools/local-ocr/runtime")
          pdf_runtime = directory(root / "tools/scanned-pdf/runtime")
          selections.extend([
              ("runtime/local-ocr-manifest.json", ocr_runtime / "manifest.json"),
              ("runtime/scanned-pdf-manifest.json", pdf_runtime / "manifest.json"),
          ])
          attempts = directory(ocr_runtime / "initialization-attempts")
          children = list(attempts.iterdir())
          if len(children) != 1:
              raise ValueError("fresh workflow requires one unambiguous startup attempt")
          attempt = directory(children[0])
          if not re.fullmatch(
                  r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}-[0-9]{2}"
                  r"(?:\.[0-9]{6})?\+00-00-[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}"
                  r"-[89ab][0-9a-f]{3}-[0-9a-f]{12}", attempt.name):
              raise ValueError("unexpected startup attempt identifier")
          attempt_names = [
              "started.json", "source-before.json", "source-after.json",
              "stdout.txt", "stderr.txt", "summary.json",
          ]
          if sorted(item.name for item in attempt.iterdir()) != sorted(attempt_names):
              raise ValueError("startup evidence is incomplete or contains unexpected members")
          selections.extend(("startup/" + name, attempt / name) for name in attempt_names)

          payloads, total = [], 0
          for label, selected in selections:
              descriptor = os.open(selected, os.O_RDONLY | os.O_NOFOLLOW | os.O_CLOEXEC)
              with os.fdopen(descriptor, "rb") as stream:
                  before = os.fstat(stream.fileno())
                  if not stat.S_ISREG(before.st_mode) or before.st_size > 4 * 1024 * 1024:
                      raise ValueError("capture member is not an admitted bounded regular file")
                  raw = stream.read(4 * 1024 * 1024 + 1)
                  after = os.fstat(stream.fileno())
              identity = lambda item: (item.st_dev, item.st_ino, item.st_size, item.st_mtime_ns)
              if len(raw) != before.st_size or identity(before) != identity(after):
                  raise ValueError("capture member changed during read")
              total += len(raw)
              if total > 16 * 1024 * 1024:
                  raise ValueError("aggregate capture exceeds bound")
              payloads.append((label, raw))
          captured = dict(payloads)
          for name in ("started.json", "summary.json"):
              row = json.loads(captured["startup/" + name])
              if row["attempt"] != attempt.name or not attempt.name.startswith(
                      row["startedAt"].replace(":", "-") + "-"):
                  raise ValueError("startup receipt does not name the selected attempt")
          manifest = []
          for label, raw in payloads:
              manifest.append({"file": label, "bytes": len(raw), "sha256": hashlib.sha256(raw).hexdigest()})
              for offset in range(0, max(1, len(raw)), 16384):
                  record = {"file": label, "encoding": "base64", "offset": offset,
                            "total_bytes": len(raw),
                            "data": base64.b64encode(raw[offset:offset + 16384]).decode("ascii")}
                  print("OCR_REPORT_CAPTURE_BYTES " + json.dumps(record, sort_keys=True), flush=True)
          print("OCR_REPORT_CAPTURE_MANIFEST_JSON=" + json.dumps({
              "schemaVersion": "ei-inspection-ocr-capture-mirror/1",
              "mode": "local-synthetic-native-evidence",
              "startupAttempt": attempt.name,
              "members": manifest, "totalBytes": total, "acceptanceAuthority": "none",
          }, sort_keys=True), flush=True)
          PY
      - name: Preserve local source, output and failure evidence without native libraries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: inspection-ocr-report-evidence
          path: |
            ${{ runner.temp }}/ei-inspection-media-evidence/
            ${{ runner.temp }}/ei-inspection-ocr-evidence/
            tools/local-ocr/runtime/manifest.json
            tools/local-ocr/runtime/initialization-attempts/
            tools/scanned-pdf/runtime/manifest.json
          if-no-files-found: error
          retention-days: 90
