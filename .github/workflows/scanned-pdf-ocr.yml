name: bounded scanned PDF to OCR composition

on:
  push:
    paths:
      - src/extraction/scanned-pdf-ocr/**
      - src/extraction/scanned-pdf/**
      - src/extraction/local-ocr/**
      - tests/extraction/scanned-pdf-ocr/**
      - tests/extraction/scanned-pdf/**
      - tests/extraction/local-ocr/**
      - tools/scanned-pdf-ocr/**
      - tools/scanned-pdf/**
      - tools/local-ocr/**
      - tools/verify-scanned-pdf-ocr.mjs
      - docs/extraction/scanned-pdf-ocr.md
      - .github/workflows/scanned-pdf-ocr.yml
      - package.json
      - package-lock.json
      - tsconfig.types.json
  pull_request:
    paths:
      - src/extraction/scanned-pdf-ocr/**
      - src/extraction/scanned-pdf/**
      - src/extraction/local-ocr/**
      - tests/extraction/scanned-pdf-ocr/**
      - tests/extraction/scanned-pdf/**
      - tests/extraction/local-ocr/**
      - tools/scanned-pdf-ocr/**
      - tools/scanned-pdf/**
      - tools/local-ocr/**
      - tools/verify-scanned-pdf-ocr.mjs
      - docs/extraction/scanned-pdf-ocr.md
      - .github/workflows/scanned-pdf-ocr.yml
      - package.json
      - package-lock.json
      - tsconfig.types.json

permissions:
  contents: read

jobs:
  scanned-pdf-ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.3
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: 3.12.14
          architecture: x64
      - name: Install the reviewed PDFium wheel and bind this host closure
        run: python tools/scanned-pdf/install.py
      - name: Install the reviewed native OCR libraries and exact English model
        run: python tools/local-ocr/install.py
      - run: npm ci
      - name: Install the locked host TypeScript compiler
        run: node tools/install-typescript-host.mjs
      - name: Require every composed native, deadline, negative, recovery and boundary case
        run: node tools/verify-scanned-pdf-ocr.mjs
      - name: Typecheck the private composed consumer
        run: >-
          ./node_modules/.bin/tsc --noEmit --strict --target ES2022 --module NodeNext
          --moduleResolution NodeNext --lib ES2022,DOM --types node --skipLibCheck false
          --noErrorTruncation tests/extraction/scanned-pdf-ocr/types-consumer.mts
      - name: Typecheck the PDF reader's lower-only deadline option
        run: >-
          ./node_modules/.bin/tsc --noEmit --strict --target ES2022 --module NodeNext
          --moduleResolution NodeNext --lib ES2022,DOM --types node --skipLibCheck false
          --noErrorTruncation tests/extraction/scanned-pdf/types-consumer.mts
      - name: Typecheck the OCR reader's lower-only deadline option
        run: >-
          ./node_modules/.bin/tsc --noEmit --strict --target ES2022 --module NodeNext
          --moduleResolution NodeNext --lib ES2022,DOM --types node --skipLibCheck false
          --noErrorTruncation tests/extraction/local-ocr/types-consumer.mts
      - run: npm run typecheck
      - name: Preserve all composed attempts and the two distinct native dependency receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: scanned-pdf-ocr-verification
          path: |
            src/extraction/scanned-pdf-ocr/profile.mjs
            src/extraction/scanned-pdf/profile.json
            src/extraction/local-ocr/profile.json
            tools/scanned-pdf/lock.json
            tools/scanned-pdf/runtime/manifest.json
            tools/local-ocr/lock.json
            tools/local-ocr/provenance.json
            tools/local-ocr/notices/
            tools/local-ocr/runtime/manifest.json
            tools/local-ocr/runtime/host-provenance.json
            tools/local-ocr/runtime/host-notices/
            tools/local-ocr/runtime/verification.json
            tools/local-ocr/runtime/initialization-attempts/
            tools/scanned-pdf-ocr/runtime/verification.json
            tools/scanned-pdf-ocr/runtime/verification/
          if-no-files-found: error
          retention-days: 90
