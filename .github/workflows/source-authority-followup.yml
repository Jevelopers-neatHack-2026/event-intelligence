name: private source authority follow-up

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-authority-followup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      - name: Install the locked host TypeScript compiler
        run: node tools/install-typescript-host.mjs
      - name: Verify bounded follow-up with actual local retrieval and synthetic authorities
        run: node tools/verify-source-authority-followup.mjs
      - name: Type-check strict private follow-up consumer
        run: >-
          ./node_modules/.bin/tsc --noEmit --strict --target ES2022 --module NodeNext
          --moduleResolution NodeNext --lib ES2022,DOM --types node --skipLibCheck false
          --noErrorTruncation tests/research/source-authority-followup/types-consumer.mts
      - run: npm run typecheck
      - name: Preserve source-bound verification attempts, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: private-source-authority-followup
          path: .tmp/source-authority-followup/
          include-hidden-files: true
          if-no-files-found: warn
